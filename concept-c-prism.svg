    </filter>
  </defs>
  <rect x="2" y="2" width="196" height="196" rx="44" fill="url(#bg)"/>
          <rect x="2.5" y="2.5" width="195" height="195" rx="43.5" fill="none" stroke="#26313f" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <polygon points="48,68 100,98 100,158 48,128" fill="url(#steelDark)"/>
    <polygon points="152,68 100,98 100,158 152,128" fill="url(#amberDark)"/>
    <polygon points="100,38 152,68 100,98 48,68" fill="url(#amber)"/>
