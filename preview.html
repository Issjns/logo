<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terranex — Brand Preview</title>
<style>
  :root{
    --amber1:#FFB000; --amber2:#FF8A00;
    --dark1:#0A0E14; --dark2:#0F1620;
    --steel:#3DA9FC; --light:#E8EDF4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--dark1);color:var(--light);padding:48px;}
  h1{font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--steel);margin-bottom:32px;font-weight:600;}
  .grid{display:grid;gap:24px;max-width:880px;}
  .card{border:1px solid #1d2a3a;border-radius:18px;padding:36px;display:flex;align-items:center;justify-content:center;}
  .dark{background:var(--dark2);}
  .light{background:var(--light);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  .label{font-size:11px;letter-spacing:2px;color:#5a6b80;text-transform:uppercase;margin-bottom:10px;}
  .swatches{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;}
  .sw{border-radius:12px;padding:16px;width:150px;border:1px solid #1d2a3a;}
  .sw span{display:block;font-size:11px;margin-top:40px;opacity:.85;}
  .sw small{font-size:10px;opacity:.6;}
  img{max-width:100%;height:auto;}
</style>
</head>
<body>
  <h1>Terranex · Logo System</h1>
  <div class="grid">
    <div>
      <div class="label">Primary — dark background</div>
      <div class="card dark"><img src="terranex-logo.svg" alt="Terranex primary logo" width="460"></div>
    </div>

    <div class="row">
      <div>
        <div class="label">Light background</div>
        <div class="card light"><img src="terranex-logo-light.svg" alt="Terranex light logo" width="100%"></div>
      </div>
      <div>
        <div class="label">App icon / favicon</div>
        <div class="card dark"><img src="terranex-icon.svg" alt="Terranex icon" width="150"></div>
      </div>
    </div>

    <div>
      <div class="label">Palette</div>
      <div class="swatches">
        <div class="sw" style="background:linear-gradient(135deg,#FFB000,#FF8A00)"><span>Amber accent</span><small>#FFB000 → #FF8A00</small></div>
        <div class="sw" style="background:#0A0E14"><span>Charcoal-navy</span><small>#0A0E14</small></div>
        <div class="sw" style="background:#0F1620"><span>Base navy</span><small>#0F1620</small></div>
        <div class="sw" style="background:#3DA9FC"><span>Steel blue</span><small>#3DA9FC</small></div>
        <div class="sw" style="background:#E8EDF4;color:#0A0E14"><span>Off-white</span><small>#E8EDF4</small></div>
      </div>
    </div>
  </div>
</body>
</html>
