<svg width="520" height="140" viewBox="0 0 520 140" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terranex logo">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5FBBFF"/>
      <stop offset="100%" stop-color="#3DA9FC"/>
    </linearGradient>
  </defs>

  <!-- Icon: a 4-point "north star" rising over a terrain ridge -->
  <g transform="translate(20,20)">
    <!-- rounded tile base -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#0F1620"/>
    <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="23.25" fill="none" stroke="#1d2a3a" stroke-width="1.5"/>

    <!-- steel-blue terrain ridge -->
    <path d="M14 74 L40 50 L56 64 L78 40 L86 48 L86 80 Q86 86 80 86 L20 86 Q14 86 14 80 Z" fill="url(#steel)" opacity="0.9"/>
    <path d="M14 74 L40 50 L56 64 L78 40" fill="none" stroke="#E8EDF4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- amber north star -->
    <path d="M58 14
             C60 28 64 32 78 34
             C64 36 60 40 58 54
             C56 40 52 36 38 34
             C52 32 56 28 58 14 Z" fill="url(#amber)"/>
    <circle cx="58" cy="34" r="3.2" fill="#FFE8B0"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(146,0)">
    <text x="0" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="0.5" fill="#E8EDF4">terra<tspan fill="url(#amber)">nex</tspan></text>
    <text x="2" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="500" letter-spacing="6" fill="#3DA9FC">BUILD · CONNECT · SCALE</text>
  </g>
</svg>
